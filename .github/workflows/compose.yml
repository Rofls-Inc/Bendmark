name: compose

on:
  pull_request:
    paths:
      - "services/agent/**"
      - "services/analyzer/**"
      - "services/coordinator/**"
      - "services/emulator/**"
      - "services/injector/**"
      - "services/web/**"
      - "proto/**"
      - "testdata/results/**"
      - "testdata/scenarios/smoke*.json"
      - "scripts/compose_smoke.py"
      - "examples/**"
      - "docker-compose.yml"
      - ".github/compose.emulator-smoke.yml"
      - ".github/workflows/compose.yml"
  push:
    branches: [main, dev]
    paths:
      - "services/agent/**"
      - "services/analyzer/**"
      - "services/coordinator/**"
      - "services/emulator/**"
      - "services/injector/**"
      - "services/web/**"
      - "proto/**"
      - "testdata/results/**"
      - "testdata/scenarios/smoke*.json"
      - "scripts/compose_smoke.py"
      - "examples/**"
      - "docker-compose.yml"
      - ".github/compose.emulator-smoke.yml"
      - ".github/workflows/compose.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose --profile tools build

      - name: Start stack
        # --wait ждёт healthy у abstock, agent, analyzer и coordinator; web должен запуститься
        run: docker compose up -d --wait --wait-timeout 180

      - name: Coordinator is healthy
        run: curl --fail --silent --show-error http://localhost:5080/health

      - name: Web serves the interface
        run: curl --fail --silent --show-error http://localhost:5173/ > /dev/null

      - name: Web proxies the coordinator
        # nginx снимает префикс /api и передаёт запрос координатору
        run: curl --fail --silent --show-error http://localhost:5173/api/health

      - name: Full run through coordinator and web proxy
        timeout-minutes: 1
        # Два коротких прогона: HTTP API координатора и /api веба. Общий таймаут — 45 с.
        run: python3 scripts/compose_smoke.py

      - name: Run uses three agents
        # Координатор делит нагрузку между agent, agent-2 и agent-3 (#78)
        run: |
          curl --fail --silent --show-error 'http://localhost:5080/runs?limit=1' > runs.json
          id=$(jq -er '.runs[0].id' runs.json)
          curl --fail --silent --show-error "http://localhost:5080/runs/$id" > run.json
          jq '{status, agent_count}' run.json
          jq -e '.status == "completed" and .agent_count == 3' run.json

      - name: Full POST run through coordinator and web proxy
        timeout-minutes: 1
        # Ждём результаты и анализ, чтобы следующий тест не получил занятого агента.
        run: python3 scripts/compose_smoke.py --scenario testdata/scenarios/smoke-post.json

      - name: Agent sends POST to abstock
        timeout-minutes: 2
        # negotiate SignalR - единственный POST ABStock без antiforgery-токена
        run: |
          docker compose run --rm -T agent 'http://abstock:8080/_blazor/negotiate?negotiateVersion=1' \
            --steps 10:2 --method POST --header 'Accept: application/json' > result-post.json
          cat result-post.json
          jq -e '.steps | length == 1 and .[0].request_count > 0
                 and .[0].errors.count == 0 and .[0].skipped_count == 0' result-post.json

      - name: Analyzer service answers FindLimit
        # Внутри контейнера: сгенерированный код лежит в /app/generated
        run: |
          docker compose exec -T analyzer python - <<'EOF'
          import sys
          sys.path.insert(0, "/app/generated")
          import grpc
          from bendmark.v1 import analyzer_pb2, analyzer_pb2_grpc, common_pb2

          def step(index, rps, p99):
              return common_pb2.StepResult(
                  index=index, target_rps=rps, duration_seconds=10, request_count=int(rps * 10),
                  throughput_rps=rps, latency_ms=common_pb2.LatencyPercentiles(p99=p99),
                  errors=common_pb2.RequestErrors())

          stub = analyzer_pb2_grpc.AnalyzerServiceStub(grpc.insecure_channel("127.0.0.1:50052"))
          # Отказ на ступенях 3 и 4 подряд: предел подтверждён, до него две ступени - есть диагноз
          request = analyzer_pb2.FindLimitRequest(
              steps=[step(1, 100, 20), step(2, 200, 30), step(3, 300, 900), step(4, 400, 950)])
          response = stub.FindLimit(request, timeout=5)
          print(response)
          limit, diagnosis = response.limit, response.diagnosis
          assert limit.found and limit.confirmed and limit.limit_rps == 200 and limit.failed_step_index == 3
          assert diagnosis.status == analyzer_pb2.DIAGNOSIS_STATUS_DIAGNOSED
          assert diagnosis.cause == analyzer_pb2.CAUSE_SLOW_RESPONSES and diagnosis.evidence
          EOF

      - name: Analyzer CLI reads a result
        run: docker compose run --rm analyzer-cli testdata/results/limit-found.json

      - name: Smoke rejects an unavailable agent
        timeout-minutes: 1
        run: |
          broken_container="bendmark-smoke-broken-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker logs "$broken_container" || true
            docker rm -f "$broken_container" >/dev/null || true
          }
          trap cleanup EXIT
          # Свой порт и БД: основной координатор и его прогоны остаются доступны.
          docker compose run --rm --no-deps -d --name "$broken_container" \
            -p 127.0.0.1:5081:5080 \
            -e Agent__Addresses__0=http://127.0.0.1:1 \
            -e Storage__Path=/tmp/smoke-negative.db coordinator
          # Docker может открыть порт до готовности Kestrel: возможен и сброс соединения.
          curl --fail --silent --show-error --retry 10 --retry-delay 1 \
            --retry-all-errors --retry-max-time 20 --max-time 2 http://localhost:5081/health
          if python3 scripts/compose_smoke.py --base-url http://localhost:5081 --timeout 10 > broken-agent.log 2>&1; then
            cat broken-agent.log
            echo '::error::Smoke accepted a broken agent connection'
            exit 1
          fi
          cat broken-agent.log
          # Ошибка должна быть после создания прогона, а не из-за недоступности HTTP API.
          grep -q 'status=failed' broken-agent.log

      - name: Emulator reports no limit in healthy mode
        timeout-minutes: 3
        run: |
          docker compose -f docker-compose.yml -f .github/compose.emulator-smoke.yml \
            up -d --build --wait --wait-timeout 60 emulator
          python3 scripts/compose_smoke.py --base-url http://localhost:5173/api \
            --scenario testdata/scenarios/smoke-emulator.json --emulator-mode healthy

      - name: Emulator reports a confirmed limit in reject mode
        timeout-minutes: 2
        env:
          SMOKE_EMULATOR_MODE: reject
        run: |
          docker compose -f docker-compose.yml -f .github/compose.emulator-smoke.yml \
            up -d --no-deps --force-recreate --wait --wait-timeout 60 emulator
          # 3 workers / 0.25 s = 12 RPS. 10.5 RPS leaves scheduling margin
          # below capacity and stays within the 15% tolerance.
          python3 scripts/compose_smoke.py --base-url http://localhost:5173/api \
            --scenario testdata/scenarios/smoke-emulator.json --emulator-mode reject --expected-limit-rps 12

      - name: Logs
        if: failure()
        run: docker compose --profile emulator logs

      - name: Stop stack
        if: always()
        run: docker compose --profile tools --profile emulator down -v
