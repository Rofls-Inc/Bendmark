name: emulator

on:
  pull_request:
    paths:
      - "services/emulator/**"
      - ".github/workflows/emulator.yml"
  push:
    branches: [main, dev]
    paths:
      - "services/emulator/**"
      - ".github/workflows/emulator.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: services/emulator

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/emulator/go.mod
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go test -race -timeout 60s ./...
      - run: go vet ./...
