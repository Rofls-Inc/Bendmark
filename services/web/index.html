<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Устанавливаем тему до первой отрисовки.
      (() => {
        let preference
        try {
          preference = localStorage.getItem('bendmark.theme')
        } catch {
          // Хранилище может быть заблокировано настройками браузера.
        }
        const dark = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? true
        document.documentElement.dataset.theme =
          preference === 'light' || preference === 'dark' ? preference : dark ? 'dark' : 'light'
      })()
    </script>
    <title>Bendmark</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
