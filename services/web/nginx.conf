server {
    listen 80;
    root /usr/share/nginx/html;

    # Браузер ходит на /api того же origin, nginx снимает префикс и передаёт координатору
    location /api/ {
        proxy_pass ${COORDINATOR_URL}/;
        proxy_set_header Host $host;
    }

    # Маршруты React (/runs/...) отдают index.html
    location / {
        try_files $uri /index.html;
    }
}
