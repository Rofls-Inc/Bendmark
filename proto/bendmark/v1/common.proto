syntax = "proto3";

package bendmark.v1;

option csharp_namespace = "Bendmark.Contracts.V1";

// A scenario is created by the coordinator and executed by one agent in v1.
message Scenario {
  string name = 1;
  Target target = 2;
  // Non-empty, executed in this order. Constant or decreasing loads are allowed.
  // Only FindLimit requires strictly increasing target_rps.
  repeated Step steps = 3;
}

message Target {
  // Absolute HTTP(S) URL reachable from the agent, not from the user's browser.
  string url = 1;
  // Only uppercase GET is supported in v1. Reject other values at both inputs.
  string method = 2;
}

message Step {
  // Planned requests per second; finite and greater than zero.
  double target_rps = 1;
  // Planned scheduling window in seconds; finite and greater than zero.
  // Fractional seconds are supported, as in the coordinator's scenario model.
  double duration_seconds = 2;
}

// A fully completed step, produced by the agent. Interrupted steps are omitted.
// result.json is mapped explicitly by the coordinator; it is not ProtoJSON.
message StepResult {
  // One-based position in Scenario.steps, including when a run is stopped.
  uint32 index = 1;
  double target_rps = 2;
  // Planned scheduling window, not the wall time including draining requests.
  // Equal to Scenario.steps[index - 1].duration_seconds; never used for partial steps.
  double duration_seconds = 3;
  // All completed attempts: successful responses, HTTP errors and transport errors.
  // Requests never sent are not completed attempts.
  uint64 request_count = 4;
  // request_count / duration_seconds, including unsuccessful attempts.
  double throughput_rps = 5;
  LatencyPercentiles latency_ms = 6;
  RequestErrors errors = 7;
  // Scheduled ticks never sent because the worker pool was full.
  // Excluded from request_count, percentiles and errors. Not a service failure.
  // FindLimit rejects measurements with skipped_count > 0 in v1.
  uint64 skipped_count = 8;
}

message LatencyPercentiles {
  // Milliseconds from the scheduled send time to completion or timeout.
  // Include failed attempts; compute all percentiles over the same population.
  // All three are zero when request_count is zero: this means no measurements.
  double p50 = 1;
  double p90 = 2;
  double p99 = 3;
}

message RequestErrors {
  // HTTP 4xx/5xx, timeouts and other transport failures; <= request_count.
  uint64 count = 1;
  // 100 * count / request_count, or zero when request_count is zero.
  // Never use planned or skipped requests here.
  double rate_percent = 2;
}
