# Весь стенд одной командой: docker compose up --build
# Интерфейс: http://localhost:5173, координатор: http://localhost:5080, ABStock: http://localhost:5062,
# анализатор (gRPC): localhost:50052

name: bendmark

services:
  # Тестовый сервис. Собираем из его репозитория, коммит зафиксирован,
  # чтобы замеры не менялись от чужих правок. Имя abstock используется
  # в сценариях: http://abstock:8080/
  abstock:
    build:
      context: https://github.com/yarosvla/ABStock.git#d0e030efeebd88481b841b50f486292557388eee
    ports:
      - "127.0.0.1:5062:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ABStock: "Data Source=/app/data/abstock.db"
    volumes:
      - abstock-data:/app/data
      - abstock-keys:/home/app/.aspnet/DataProtection-Keys
    networks: [bendmark]
    healthcheck:
      # В образе aspnet нет curl, поэтому HTTP-запрос через /dev/tcp в bash
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET / HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 60s

  # Агент — gRPC-сервер AgentService (#45). Слушает 50051, ждёт Run от координатора.
  # Значение по умолчанию для команды задаётся здесь, чтобы `docker compose run`
  # мог подменить его аргументами CLI-режима (URL, --steps, ...).
  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    command: ["--listen", "0.0.0.0:50051"]
    ports:
      - "127.0.0.1:50051:50051"
    networks: [bendmark]
    depends_on:
      abstock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/50051"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  coordinator:
    build:
      context: .
      dockerfile: services/coordinator/Dockerfile
    ports:
      - "127.0.0.1:5080:5080"
    environment:
      Agent__Address: http://agent:50051
      Analyzer__Address: http://analyzer:50052
    # Прогоны в SQLite переживают пересоздание контейнера
    volumes:
      - coordinator-data:/app/data
    networks: [bendmark]
    depends_on:
      abstock:
        condition: service_healthy
      analyzer:
        condition: service_healthy
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5080 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 20s

  # Веб-интерфейс: nginx раздаёт статику и проксирует /api/ координатору
  web:
    build: services/web
    ports:
      - "127.0.0.1:5173:80"
    networks: [bendmark]
    depends_on:
      coordinator:
        condition: service_healthy

  # Анализатор — gRPC-сервис FindLimit (#34); его вызывает координатор после прогона
  analyzer:
    build:
      context: .
      dockerfile: services/analyzer/Dockerfile
    ports:
      - "127.0.0.1:50052:50052"
    networks: [bendmark]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 50052), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Анализатор из командной строки по файлу result.json — тот же образ, что у сервиса
  analyzer-cli:
    build:
      context: .
      dockerfile: services/analyzer/Dockerfile
    profiles: [tools]
    entrypoint: ["python", "-m", "analyzer"]
    command: []
    # Читает только файлы, сеть не нужна
    network_mode: none
    working_dir: /data
    volumes:
      - .:/data:ro

networks:
  bendmark:

volumes:
  abstock-data:
  abstock-keys:
  coordinator-data: